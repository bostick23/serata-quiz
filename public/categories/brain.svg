<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="brainL" x1="20" y1="22" x2="60" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="brainR" x1="60" y1="22" x2="100" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="bulb" x1="48" y1="90" x2="72" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bg)" opacity="0.12"/>
  <circle cx="60" cy="60" r="56" stroke="url(#bg)" stroke-width="2.5" fill="none" opacity="0.35"/>

  <!-- Brain left hemisphere -->
  <path d="M60 24 C50 20 40 22 34 28 C26 24 20 30 18 38 C12 40 10 48 14 56 C10 62 12 70 18 76 C22 84 32 86 42 84 L52 84 C56 84 60 82 60 78 Z" fill="url(#brainL)" stroke="#db2777" stroke-width="2"/>

  <!-- Brain right hemisphere -->
  <path d="M60 24 C70 20 80 22 86 28 C94 24 100 30 102 38 C108 40 110 48 106 56 C110 62 108 70 102 76 C98 84 88 86 78 84 L68 84 C64 84 60 82 60 78 Z" fill="url(#brainR)" stroke="#db2777" stroke-width="2"/>

  <!-- Center line -->
  <line x1="60" y1="24" x2="60" y2="84" stroke="#db2777" stroke-width="1.8" opacity="0.6"/>

  <!-- Brain folds - left -->
  <path d="M24 48 C30 42 38 44 42 50 C46 56 40 60 34 58" fill="none" stroke="#db2777" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <path d="M18 62 C24 56 32 58 38 64" fill="none" stroke="#db2777" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <path d="M30 32 C36 28 44 30 48 36" fill="none" stroke="#db2777" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M26 72 C32 68 40 70 44 76" fill="none" stroke="#db2777" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Brain folds - right -->
  <path d="M96 48 C90 42 82 44 78 50 C74 56 80 60 86 58" fill="none" stroke="#db2777" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <path d="M102 62 C96 56 88 58 82 64" fill="none" stroke="#db2777" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <path d="M90 32 C84 28 76 30 72 36" fill="none" stroke="#db2777" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M94 72 C88 68 80 70 76 76" fill="none" stroke="#db2777" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Light bulb underneath -->
  <path d="M52 88 C52 86 54 84 56 84 L64 84 C66 84 68 86 68 88 L68 94 C68 96 66 98 64 98 L56 98 C54 98 52 96 52 94 Z" fill="url(#bulb)" stroke="#d97706" stroke-width="1.5"/>
  <!-- Bulb screw lines -->
  <line x1="54" y1="92" x2="66" y2="92" stroke="#d97706" stroke-width="1" opacity="0.6"/>
  <line x1="54" y1="95" x2="66" y2="95" stroke="#d97706" stroke-width="1" opacity="0.6"/>

  <!-- Light rays from bulb -->
  <line x1="48" y1="91" x2="42" y2="91" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="72" y1="91" x2="78" y2="91" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="50" y1="100" x2="46" y2="104" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="70" y1="100" x2="74" y2="104" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Electric sparks / synapses around the brain -->
  <circle cx="16" cy="44" r="2.5" fill="#fbbf24" filter="url(#sparkGlow)" opacity="0.8"/>
  <circle cx="104" cy="44" r="2.5" fill="#fbbf24" filter="url(#sparkGlow)" opacity="0.8"/>
  <circle cx="36" cy="18" r="2" fill="#a78bfa" filter="url(#sparkGlow)" opacity="0.7"/>
  <circle cx="84" cy="18" r="2" fill="#a78bfa" filter="url(#sparkGlow)" opacity="0.7"/>
  <circle cx="60" cy="12" r="2" fill="#fbbf24" filter="url(#sparkGlow)" opacity="0.6"/>

  <!-- Tiny lightning bolts -->
  <path d="M26 14 L28 18 L25 18 L27 22" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>
  <path d="M94 14 L92 18 L95 18 L93 22" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>

  <!-- Question mark overlay (knowledge symbol) -->
  <text x="60" y="62" text-anchor="middle" font-family="serif" font-size="28" font-weight="bold" fill="white" opacity="0.2">?</text>
</svg>
