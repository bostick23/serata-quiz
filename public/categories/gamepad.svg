<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="screen" x1="28" y1="22" x2="92" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="30" y1="24" x2="90" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sword" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neon">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bg)" opacity="0.12"/>
  <circle cx="60" cy="60" r="56" stroke="url(#bg)" stroke-width="2.5" fill="none" opacity="0.35"/>

  <!-- Retro arcade monitor body -->
  <rect x="24" y="18" width="72" height="56" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
  <!-- Screen bezel -->
  <rect x="30" y="24" width="60" height="42" rx="3" fill="url(#screen)" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Screen glow overlay -->
  <rect x="30" y="24" width="60" height="42" rx="3" fill="url(#screenGlow)"/>

  <!-- Pixel character on screen - little hero -->
  <!-- Body -->
  <rect x="54" y="40" width="12" height="12" rx="1" fill="#22d3ee" opacity="0.9"/>
  <!-- Head -->
  <rect x="56" y="32" width="8" height="8" rx="1" fill="#fbbf24" opacity="0.9"/>
  <!-- Eyes -->
  <rect x="57" y="34" width="2" height="2" fill="#0f172a"/>
  <rect x="61" y="34" width="2" height="2" fill="#0f172a"/>
  <!-- Sword in hand -->
  <rect x="66" y="34" width="2" height="14" rx="0.5" fill="#e2e8f0"/>
  <rect x="64" y="38" width="6" height="2" rx="0.5" fill="#d97706"/>
  <!-- Shield -->
  <rect x="50" y="40" width="4" height="8" rx="1" fill="#ef4444"/>
  <rect x="51" y="42" width="2" height="4" rx="0.5" fill="#fbbf24"/>
  <!-- Legs -->
  <rect x="55" y="52" width="4" height="4" fill="#6366f1" opacity="0.8"/>
  <rect x="61" y="52" width="4" height="4" fill="#6366f1" opacity="0.8"/>

  <!-- Pixel hearts (lives) top-left of screen -->
  <g filter="url(#neon)">
    <path d="M34 28 L35 27 L36 28 L35 30 Z" fill="#ef4444"/>
    <path d="M39 28 L40 27 L41 28 L40 30 Z" fill="#ef4444"/>
    <path d="M44 28 L45 27 L46 28 L45 30 Z" fill="#ef4444"/>
  </g>

  <!-- Score text top-right -->
  <text x="85" y="31" text-anchor="end" font-family="monospace" font-size="6" fill="#22d3ee" opacity="0.8">HI 99950</text>

  <!-- Pixel ground on screen -->
  <line x1="32" y1="58" x2="88" y2="58" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>
  <rect x="36" y="58" width="4" height="4" fill="#166534" opacity="0.4"/>
  <rect x="52" y="58" width="6" height="3" fill="#166534" opacity="0.4"/>
  <rect x="74" y="58" width="4" height="4" fill="#166534" opacity="0.4"/>

  <!-- Pixel stars/coins on screen -->
  <rect x="40" y="36" width="3" height="3" rx="0.5" fill="#fbbf24" filter="url(#neon)" opacity="0.8"/>
  <rect x="78" y="42" width="3" height="3" rx="0.5" fill="#fbbf24" filter="url(#neon)" opacity="0.8"/>

  <!-- Scanlines effect -->
  <line x1="30" y1="30" x2="90" y2="30" stroke="white" stroke-width="0.3" opacity="0.08"/>
  <line x1="30" y1="36" x2="90" y2="36" stroke="white" stroke-width="0.3" opacity="0.08"/>
  <line x1="30" y1="42" x2="90" y2="42" stroke="white" stroke-width="0.3" opacity="0.08"/>
  <line x1="30" y1="48" x2="90" y2="48" stroke="white" stroke-width="0.3" opacity="0.08"/>
  <line x1="30" y1="54" x2="90" y2="54" stroke="white" stroke-width="0.3" opacity="0.08"/>
  <line x1="30" y1="60" x2="90" y2="60" stroke="white" stroke-width="0.3" opacity="0.08"/>

  <!-- Monitor stand -->
  <rect x="50" y="74" width="20" height="6" rx="1" fill="#475569"/>
  <rect x="42" y="80" width="36" height="4" rx="2" fill="#334155" stroke="#475569" stroke-width="1"/>

  <!-- LED power light -->
  <circle cx="60" cy="70" r="2" fill="#22c55e" filter="url(#glow)" opacity="0.9"/>

  <!-- Decorative floating pixels outside -->
  <rect x="12" y="32" width="4" height="4" rx="0.5" fill="#8b5cf6" opacity="0.4" transform="rotate(15 14 34)"/>
  <rect x="104" y="36" width="4" height="4" rx="0.5" fill="#ec4899" opacity="0.4" transform="rotate(-10 106 38)"/>
  <rect x="16" y="70" width="3" height="3" rx="0.5" fill="#22d3ee" opacity="0.3"/>
  <rect x="102" y="68" width="3" height="3" rx="0.5" fill="#fbbf24" opacity="0.3"/>

  <!-- Sparkle accents -->
  <circle cx="18" cy="20" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="102" cy="22" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="60" cy="10" r="1.8" fill="#a78bfa" opacity="0.5"/>

  <!-- Small "INSERT COIN" vibe at bottom -->
  <text x="60" y="100" text-anchor="middle" font-family="monospace" font-size="5.5" fill="#6366f1" opacity="0.5" letter-spacing="1.5">PLAYER 1</text>
</svg>
